plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.google.guava:guava:33.3.1-jre'
    implementation 'org.apache.logging.log4j:log4j-api:2.24.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.24.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Unit tests: fast, offline, no API calls. This is what `./gradlew build` runs.
test {
    useJUnitPlatform {
        excludeTags 'smoke'
    }
}

// Smoke tests: hit the live Sleeper and FantasyPros APIs and check the feeds
// still look the way the code expects. Run them before the draft, and any time
// a scrape starts behaving oddly:
//
//   ./gradlew smokeTest
//   ./gradlew smokeTest -PdraftId=<sleeper mock draft id>
//
// Passing a mock draft id exercises the live-draft path against a board with
// real picks on it, which the real draft cannot offer until draft day.
tasks.register('smokeTest', Test) {
    group = 'verification'
    description = 'Checks the live APIs against what the code expects'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    workingDir = project.projectDir
    useJUnitPlatform {
        includeTags 'smoke'
    }
    if (project.hasProperty('draftId')) {
        systemProperty 'draftId', project.property('draftId')
    }
    outputs.upToDateWhen { false }
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}

// Every entry point is a plain `main`, and they all read/write their day-cached
// API responses from the working directory. `./gradlew run -Pmain=TradeFinder`
// keeps those files in the project root instead of scattering them.
tasks.register('run', JavaExec) {
    group = 'application'
    description = 'Runs a main class, e.g. ./gradlew run -Pmain=TradeFinder'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = project.findProperty('main') ?: 'TradeFinder'
    workingDir = project.projectDir
    standardInput = System.in

    // Gradle hands -D to its own daemon, not to the JVM this forks, so the
    // tuning knobs have to be passed through explicitly as -P.
    ['sims', 'candidates', 'qbADPChange', 'draftId', 'trials', 'risk', 'quantile', 'why', 'projections', 'keepers', 'as', 'search', 'adaptiveTrials', 'inner', 'mlScale', 'inners', 'mcts', 'scenarios'].each { knob ->
        if (project.hasProperty(knob)) {
            systemProperty knob, project.property(knob)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:unchecked' << '-Xlint:deprecation'
}
